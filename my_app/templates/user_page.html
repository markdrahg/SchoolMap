<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>schoolmap user's page</title>

    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'user_page.css' %}">
  </head>
  <body>

    <!-- Optional JavaScript; choose one of the two! -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>  

    <div>
        <div class="container">
            <!-- Display of user's name -->
            <h1 class="text-center p-4">{{ user.username }}'s DASHBOAR</h1>

            <!-- watchlist accordion -->
            <div class="p-3">
                <div class="accordion">
                    <div class="accordion-item">
                      <h2 class="accordion-header" id="headingOne">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                          WATCHLIST
                        </button>
                      </h2>
                      <div id="collapseOne" class="accordion-collapse collapse" aria-labelledby="headingOne" data-bs-parent="#accordionExample">
                        <div class="accordion-body">
                          <strong>Saved List</strong>
                        </div>
                      </div>
                    </div>
                </div>
            </div>
            
            <!-- School I/O interface -->
            <div class="container p-5">
                <div class="row">
                    <!-- Ex School Info -->
                    <div class="col-12 col-md-3 mb-3">
                        <h3>Ex School Info</h3>
                        <div class="mb-3">
                            <label for="exSchoolCountry" class="form-label">Country</label>
                            <input type="text" class="form-control" id="exSchoolCountry" placeholder="Country of Previous school...">
                        </div>
                        <div class="mb-3">
                            <label for="exSchoolName" class="form-label">School Name</label>
                            <input type="text" class="form-control" id="exSchoolName" placeholder="Previous school name...">
                        </div>
                        <div class="mb-3">
                            <label for="exSchoolGPA" class="form-label">Your GPA</label>
                            <input type="number" class="form-control" id="exSchoolGPA" placeholder="Your GPA score...">
                        </div>
                    </div>
        
                    <!-- School Of Interest INFO -->
                    <div class="col-12 col-md-3 mb-3">
                        <h3>School Of Interest INFO</h3>
                        <div class="mb-3">
                            <label for="interestCountry" class="form-label">Country Of Interest</label>
                            <select class="form-select" id="interestCountry" aria-label="Country of Interest">
                                <option value="1">USA</option>
                                <option value="2">Canada</option>
                                <option value="3">Germany</option>
                                <option selected value="All">All</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="acceptanceRate" class="form-label">Acceptance Rate</label>
                            <select class="form-select" id="acceptanceRate" aria-label="Acceptance Rate">
                              <option selected value="All">All</option>
                              <option value="1">Low</option>
                              <option value="2">Medium</option>
                              <option value="3">High</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-secondary col-12" id="load-schools-button">Search</button>
                    </div>
        
                    <!-- Results -->
                    <div class="col-12 col-md-6 mb-3">
                        <h3>Results</h3>
                        <p>Output</p>
                        <p>School Name -> Country -> Aceeptance Rate -> website</p>

                        <div class="accordion">
                          <div class="accordion-item">
                            <h2 class="accordion-header" id="headingOne">
                              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="true" aria-controls="collapseTwo">
                                DATA OUT
                              </button>
                            </h2>
                            <div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingOne" data-bs-parent="#accordionExample">
                              <div class="accordion-body">
                                <strong>Result</strong>
                                <p>
                                  <div id="book-container"></div>
                                </p>
                                <!-- <p>
                                  {% for school in schools %}
                                  <tr>
                                      <td>{{ school.name }}</td>
                                      <td>{{ school.acceptance_rate }}</td>
                                      <td>{{ school.country }}</td>
                                      <td><a href="{{ school.website }}" target="_blank">{{ school.website }}</a></td>
                                  </tr>
                                  {% endfor %}
                                </p> -->
                                <table>
                                  <tbody id="schools">
                                    <!-- Data will be inserted here -->
                                  </tbody>
                                </table>
                                
                              </div>
                            </div>
                          </div>
                      </div>
                        
                        <div id="book-container"></div>
                    </div>
                    <tbody id="schools">
                      <!-- Data will be inserted here -->
                  </tbody>
                </div>
                <script src="{% static 'user_MySQL_API.js' %}"></script>
            </div>

        </div>
    </div>
  </body>
</html>
